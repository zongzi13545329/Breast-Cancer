# Configuration for Fairness Model (Temporal + Race-Conditional Adaptation)

model:
  backbone: "resnet50"
  pretrained: true
  freeze_backbone_epochs: 5
  
  # Temporal settings (ENABLED)
  use_temporal: true
  temporal_fusion: "attention"
  
  # Fairness settings (ENABLED)
  use_fairness: true
  fairness_method: "race_conditional"  # Options: race_conditional, adversarial
  adapter_dim: 64
  num_races: 5  # African American, White, Asian, Hispanic
  
  num_classes: 1
  dropout: 0.3

  # Multi-task settings
  num_classes: 1        # Recall (binary)
  num_birads: 5         # BI-RADS 0,1,2,3,4 (5 classes)
  num_density: 4        # Density a,b,c,d (4 classes)
  
  # Multi-task head dimensions
  shared_head_dim: 256  # 共享特征维度
  task_head_dim: 128    # 每个任务头的隐藏层维度

training:
  # Multi-task loss weights
  recall_weight: 1.0
  birads_weight: 0.5
  density_weight: 0.3
  epochs: 100
  batch_size: 12
  learning_rate: 5e-5
  
  # Fairness-specific training
  # Focal loss helps with class imbalance
  focal_loss: true
  focal_alpha: 0.75
  focal_gamma: 2.0

fairness:
  # Fairness constraint type
  constraint: "demographic_parity"  # Options: demographic_parity, equalized_odds
  
  # Loss weights - balance task performance with fairness
  task_loss_weight: 1.0
  fairness_loss_weight: 0.3  # Start with lower weight, can increase if needed
  
  # Adversarial settings (only used if fairness_method=adversarial)
  adversarial:
    discriminator_lr: 1e-3
    gradient_reversal_lambda: 0.5
    adversary_steps: 3

evaluation:
  # Emphasize fairness metrics
  fairness_metrics:
    - "demographic_parity"
    - "equalized_odds"
    - "calibration_by_race"
    - "fpr_disparity"
    - "tpr_disparity"

experiment:
  name: "fairness_model"
  tags: ["embed", "recall_reduction", "temporal", "fairness", "race_conditional"]
  notes: "Fairness-aware temporal model with race-conditional adapters for equitable recall reduction"
