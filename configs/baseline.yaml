# Configuration for Baseline Model (Single Image, No Fairness)

model:
  backbone: "resnet50"
  pretrained: true
  freeze_backbone_epochs: 5
  
  # Temporal settings (DISABLED)
  use_temporal: false
  
  # Fairness settings (DISABLED)
  use_fairness: false
  
  num_classes: 1
  dropout: 0.3

training:
  epochs: 80
  batch_size: 16  # Can use larger batch since only one image
  learning_rate: 1e-4
  
  focal_loss: true
  focal_alpha: 0.75
  focal_gamma: 2.0

experiment:
  name: "baseline_single_image"
  tags: ["embed", "recall_reduction", "baseline", "single_image"]
  notes: "Baseline model using only current mammogram without temporal or fairness components"
